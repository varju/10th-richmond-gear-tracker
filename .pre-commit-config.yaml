repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        args: [--prose-wrap=always, --print-width=120]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run --frozen ty check
        language: system
        files: ^(.*\.py|bin/(make-icons|store-scene)|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: client-lint
        name: client lint
        entry:
          bash -c 'cd client && if [ -d node_modules ]; then npm run lint --silent; else echo "client/node_modules
          missing; skipped"; fi'
        language: system
        files: ^client/.*\.(ts|tsx|json)$
        pass_filenames: false
