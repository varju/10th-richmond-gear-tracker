name: CodeQL

# Replaces GitHub's default setup, whose Swift build cannot run: the Xcode
# project needs files that `make ios` generates.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none }
          - { language: javascript-typescript, build-mode: none }
          - { language: python, build-mode: none }
          - { language: swift, build-mode: manual }
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'swift'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - if: matrix.language == 'swift'
        run: |
          (cd client && npm ci)
          make ios IOS_SERVER_URL=https://example.org/gear
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
