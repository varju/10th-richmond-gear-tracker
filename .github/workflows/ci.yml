name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stated here rather than inherited, so a change to the repository default
# cannot silently widen what a workflow can do.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.14
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - id: pytest
        run: uv run pytest --cov --cov-report=
      - name: Coverage summary
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        run: uv run coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - id: vitest
        run: npm test -- --coverage
      - name: Coverage summary
        if: ${{ !cancelled() && steps.vitest.outcome != 'skipped' }}
        run: |
          node -e 'const t=require("./coverage/coverage-summary.json").total;console.log("| | % |\n|---|---|\n"+["statements","branches","functions","lines"].map(k=>`| ${k} | ${t[k].pct} |`).join("\n"))' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: uv sync --frozen --python 3.14
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium webkit
        working-directory: client
      - run: make e2e

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.14
      - name: Scan dependencies for known vulnerabilities (NFR-SEC-09)
        run: uv run pip-audit
