[project]
name = "gear-tracker"
version = "0.1.0"
description = "Offline-first gear inventory for a Scout group"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = []

[project.scripts]
gear-migrate = "gear_tracker.migrate:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gear_tracker"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
