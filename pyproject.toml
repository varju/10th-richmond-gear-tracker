[project]
name = "gear-tracker"
version = "0.1.0"
description = "Offline-first gear inventory for a Scout group"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "pydantic[email]>=2.13.5",
    "reportlab>=5.0.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
gear-migrate = "gear_tracker.migrate:main"
gear-admin = "gear_tracker.cli:main"
gear-serve = "gear_tracker.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "httpx2>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gear_tracker"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
