# Somewhere to start: three lockers and enough gear to see how the app behaves.
# `gear-admin load --file demo`, or `inventory = "demo"` in seed.toml. It loads
# into a database with no items and never again, so the app is the truth from
# the first item anyone adds.
#
# The format, which is all there is to it:
#
#   [[locations]]      name
#   [[categories]]     name
#   [[items]]          name, description, home, sub_location, purchase_date,
#                      category, categories
#   [[items.units]]    number, nickname, home, sub_location
#
# A unit's number is what is written on the gear, not a count (FR-INV-23). It
# may be text, and a set has gaps where things were retired. Whole numbers sort
# first and in numeric order, so 10 comes after 6 and "3b" after both.
#
# An item with units is a generic: one name for several of the same thing
# (FR-INV-21). Its units take their home from it unless they say otherwise.
# `home` names a location above; `category` names one category above, and
# `categories` names any number more, so an item can sit in several groups
# (FR-SET-07); its units take them all from the generic too. Nothing here has
# a code; codes are printed and stuck on during the labelling walk.

[[locations]]
name = "Cold locker"

[[locations]]
name = "Warm locker"

[[locations]]
name = "Garry Point yard"

[[categories]]
name = "Tents"

[[categories]]
name = "Stoves and lanterns"

[[categories]]
name = "Tarps"

[[categories]]
name = "Cooking gear"

[[categories]]
name = "Boats and trailers"

